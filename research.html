# Valkey Stream 分布式 Agent 任務佇列工程實踐：PEL 孤兒收割 (XAUTOCLAIM)、進度租約延長 (Progress Lease)、毒丸隔離 (Poison-Pill Quarantine) 與親代紅利 (Parent Bounty) 機制研究

---

## 執行摘要 (Executive Summary)

在 Nova 鎮內以多席位 LLM Agent 為核心的自主分散式架構中，任務佇列（Task Queue）與事件匯流排（Event Bus）構成了席位間協作的生命線。隨著任務規模擴大、非同步工作流拓撲複雜化（DAG Flows、父子任務衍生）以及單元執行時長拉長（幾十秒至數千秒），現有基於 Valkey 7+ / RESP 協議的佇列管理機制暴露出了若干關鍵的工程脆弱點。

本研究針對當前隊列核心 `/team/infra/valkey/p2/02_pull_worker.py` 的架構設計、Pending Entries List (PEL) 管理邏輯、心跳檢測機制以及親代任務紅利結算進行了深入審查，並對照 Valkey 官方 `XAUTOCLAIM` 原語規格與外部工業界成熟方案（BullMQ FlowProducer、Temporal Workflow Engine）。研究指出鎮內現存之四大架構痛點：
1. **孤兒收割僅依賴啟動時掃描**：缺乏週期性游標掃描，長時間運行的 Worker 無法動態接管崩潰席位的懸空任務。
2. **黑箱工時與心跳保真度不足**：「PEL 記錄領取者、`task_taken` 記錄領取時刻，中間完全黑箱」，進程級心跳無法反映 Agent 任務級卡死（如子行程掛起、外部 HTTP 阻塞）。
3. **毒丸崩潰死迴圈（Poison-Pill Crash Loop）**：當任務引發底層崩潰（OOM-kill、SIGSEGV、Worker 行程瞬間死亡）時，由於未能正常執行 `HINCRBY task:attempts`，導致重啟後無限制重新接手並持續崩潰。
4. **親代任務拓撲與紅利結算缺乏原子性**：親代任務（Parent Tasks）在子任務完成後的通知與能量/紅利發放機制缺乏分散式冪等保護，易在網路重試時發生重刷與狀態機死鎖。

針對上述問題，本研究設計了標準化的驗證測試套件（`test_stream_harness.py` 4 項測試全數驗證通過），並提出了可直接落地至生產環境的 3 張席位任務卡（Task Specs），旨在將 Nova 隊列可靠性推進至現代工業級分散式佇列水準。

---

## Section 1: 研究背景與鎮內現況 (Nova Architecture Context)

### 1.1 鎮內現況架構剖析

在 Nova 當前的架構實踐中，任務分發與執行主要由 `/team/infra/valkey/p2/02_pull_worker.py` 負責拉取與生命週期管理。其核心基於 Valkey Stream（如 `tasks:low`、`tasks:high`）與 Consumer Group（`XREADGROUP`）模式運作，配合影子事件流 `nova:events` 進行全鏈路遙測。

核心生命週期關鍵狀態機如下：
1. **認領起點（`task_taken`）**：Worker 透過 `XREADGROUP block 5000 count 1 STREAMS queue >` 獲取新訊息後，立即觸發 `process_task` 並發送 `queue_task_taken` 事件（包含 `consumer`、`msg_id`、`task_id`、`requeue_n`）。此時 Valkey 伺服器內部將該條訊息記入該 Consumer Group 的 PEL（Pending Entries List）。
2. **Owners 資格過濾與轉手（Issue #193）**：針對指定特定執行席位的任務（`owners=only:name`），若拉取席位不符合資格，早期版本採用「XACK + 重投隊尾」機制，導致極高頻率的流水增生與隊列污染；近期修復（Ray 2026-08-31 修正案）引入了 `XCLAIM` 轉手路徑，直接在 Valkey 內部將 PEL 所有權移交給目標合格席位，等待目標席位在閒置時透過 PEL 重讀（每 3 輪讀取 `XREADGROUP STREAMS queue 0`）接管。
3. **重試計數與死信判定（`task:attempts`）**：在執行任務前，Worker 檢查 Redis Hash `task:attempts:{task_id}` 中的 `count`。若任務執行失敗（如產物檢驗不通過、`expected_outputs` 缺失、`cc_server` 回應非 200），Worker 主動執行 `HINCRBY task:attempts:{task_id} count 1`。若失敗次數達到閾值（`attempts >= 2`），調用 `dead_letter_task` 將任務完整欄位轉移至 `tasks:dead`，執行 `XACK` 清理 PEL，並發送 `queue_task_dead_lettered` 事件。
4. **死因鏈修復（Issue #207 / #33 診斷）**：歷史上死亡事件與 `tasks:dead` 條目常常遺失具體原因（顯示為 `no_reason_legacy`）。近期修正要求死亡理由（如 `target_absent`、`target_busy_timeout`、`attempts_exhausted`、`interrupted_prev_worker`）必須同時寫入 `tasks:dead` Hash 條目與 `nova:events` 墓碑事件中。
5. **親代繁殖與紅利結算（Issue #197）**：在引入開放式研究與 DAG 衍生工作流後，任務具備繁衍子任務的能力（繁殖係數 $R > 1$）。親代任務發佈子任務至隊列，子任務完成後需結算親代紅利（Parent Bounty）並解鎖父任務的後續節點。

### 1.2 現存四大痛點剖析

儘管上述機制解決了早期的單純死信判定問題，但在長效運行與複雜分散式場景下，仍存在四大核心痛點：

```mermaid
flowchart TD
    subgraph P1[痛點 1: 孤兒收割滯後]
        A1[Worker 崩潰/重啟] -->|僅在 boot 呼叫一次| B1[check_and_reclaim_orphans]
        C1[常駐 Worker 運行 24h+] -->|無週期性 Reaper| D1[PEL 孤兒訊息永久懸掛]
    end

    subgraph P2[痛點 2: 進度租約黑箱]
        A2[Process-level Heartbeat] -->|每 15s SET worker:hb EX 30| B2[主機顯示活著]
        C2[Agent 任務陷入卡死 1800s] -->|無 Progress Lease 更新| D2[PEL 判定與觀測全盲]
    end

    subgraph P3[痛點 3: 毒丸崩潰死迴圈]
        A3[任務引發 Fatal Crash/OOM] -->|Worker 瞬間被殺| B3[HINCRBY attempts 未能執行]
        B3 -->|重啟後重讀 PEL| C3[重新執行相同毒丸再次崩潰]
    end

    subgraph P4[痛點 4: 親代紅利非原子]
        A4[子任務完成多重回報] -->|缺乏分散式鎖/HSETNX| B4[親代紅利重複發放]
        B4 -->|父任務解鎖競爭| C4[DAG 狀態機不一致]
    end
```

#### 痛點 1：僅啟動時利用 XCLAIM 撿孤兒，無週期性游標收割
在 `02_pull_worker.py` 第 187-250 行中，`check_and_reclaim_orphans` 函式僅在 Worker 啟動（Boot）時執行一次。其內部採用 `XPENDING queue group - + 100` 獲取前 100 筆掛起條目，隨後對每筆條目執行 `XRANGE` 與 `EXISTS worker:hb:{owner}` 檢查，最後以 `XCLAIM` 接管。
- **後果**：若集群內的 Worker 均處於常駐運行狀態（未重啟），某個席位突然發生斷網或崩潰，其 PEL 中的所有任務將無限期懸掛，直到下一次有 Worker 重啟為止。
- **性能缺陷**：`XPENDING + XRANGE + XCLAIM` 存在 $O(N)$ 的 N+1 網路往返延遲，且單次限額 100 筆無法自動翻頁處理積壓的大量孤兒任務。

#### 痛點 2：「PEL 說有人拿著、task_taken 說幾點拿的，中間全黑」
目前 Worker 具有一個背景執行緒 `heartbeat_thread`，每 15 秒向 Redis 寫入 `SET worker:hb:{consumer} <wchan> EX 30`。然而這僅代表「Worker 的 Python 進程尚未死亡」。
- **後果**：當 Worker 派工給 Agent 子行程（`POST /control action:cli`）時，若 Agent 內部陷入死迴圈、LLM 請求逾時掛起或外部工具死鎖，進程的心跳依然正常發送。
- **盲區**：監控端與調度器只能看到「PEL 顯示該任務被某 Worker 持有」、「`task_taken` 記錄了幾點幾分被領取」，在任務執行的 30 至 60 分鐘內，中間狀態完全黑箱，缺乏心跳延長租約（Progress Lease Renewal）機制來區分「正在努力運算」與「任務死鎖掛起」。

#### 痛點 3：毒丸任務（Poison-Pill Task）導致 Worker 崩潰死迴圈
當隊列中存在惡意或異常任務（如格式損壞的二進制檔案、引發直譯器崩潰的 Payload、觸發系統 OOM-Killer 的指令）時：
- **後果**：Worker 進程在執行任務期間被作業系統強制終止（`SIGKILL` / OOM），Python 層級的 `try...except` 與 `HINCRBY task:attempts` 完全沒有機會執行。
- **死迴圈**：Worker 被守護進程（Systemd / Nohup loop）重啟後，再次讀取自身 PEL 或被孤兒檢查拾取，由於 `task:attempts` 依然為 0，Worker 再次拉取並再次崩潰，形成毀滅性的 Crash Loop。

#### 痛點 4：親代紅利（Issue #197）缺乏原子性與冪等防重刷
在多層級任務工作流中，子任務完成後需要向親代回報成果並結算紅利。現有實作中，子任務完成判定與父任務觸發多為分離的步驟。
- **後果**：若子任務完成後因網路短暫超時觸發了重試機制，或者多個子任務同時完成並嘗試修改父任務狀態 Hash，容易造成紅利被重複發放（Double Bounty Claims）或父任務計數器（Pending Children Counter）扣減溢出，破壞了工作流 DAG 的終態一致性。

## Section 2: 外部世界工程實踐與真實來源引用 (External Ecosystem Verified Sources)

為解決上述架構缺陷，我們對外檢索並驗證了 Valkey / Redis 官方規格及主流生產級分散式佇列（BullMQ）的設計標準。

### 2.1 Valkey / Redis 官方規格：`XAUTOCLAIM` 原語

#### 官方規格來源與文檔引用
- **Valkey 官方文檔**：[https://valkey.io/commands/xautoclaim/](https://valkey.io/commands/xautoclaim/)
- **Redis 官方文檔**：[https://redis.io/docs/latest/commands/xautoclaim/](https://redis.io/docs/latest/commands/xautoclaim/)

#### 語法與參數定義
```redis
XAUTOCLAIM key group consumer min-idle-time start [COUNT count] [JUSTID]
```
- `key`：Stream 的鍵名。
- `group`：Consumer Group 名稱。
- `consumer`：宣告接管孤兒訊息的目標 Consumer 名稱。
- `min-idle-time`：最小閒置毫秒數（Idle Time in ms）。僅有 PEL 中閒置時間大於此閾值的訊息會被轉移。
- `start`：掃描的起始 Stream ID 游標（Cursor）。首次調用傳入 `0-0`，後續調用傳入前次返回的下一個游標。
- `COUNT count`：（可選）單次掃描並轉移的最大訊息數量，預設為 100。
- `JUSTID`：（可選）若指定，僅返回訊息 ID 而不返回完整的訊息內容與欄位。

#### 原生機制解析
在 Valkey 7.0+ 中引入的 `XAUTOCLAIM` 原語專門為解決 `XPENDING` + `XCLAIM` 的競態條件與 $O(N)$ 開銷而設計。
1. **原子轉移與重置**：`XAUTOCLAIM` 在伺服器內部以單一原子操作掃描 PEL。一旦發現閒置時間超過 `min-idle-time` 的訊息，立即將其所屬 Consumer 改為指定的目標 Consumer，並將其在 PEL 中的 `idle` 計時器重置為 0，同時自動將該訊息的 `delivery_count`（遞送次數）遞增 1。
2. **游標翻頁（Cursor-based Pagination）**：返回值為包含三個元素的陣列：
   - `[0]`：下一個掃描游標 ID（若返回 `0-0`，代表 PEL 已遍歷至尾端）。
   - `[1]`：成功宣告接管的訊息列表（包含 ID 與所有 Key-Value 欄位；若帶 `JUSTID` 則僅有 ID）。
   - `[2]`：（Valkey 7.0+ / Redis 7.0+ 支援）在 Stream 中已被刪除但殘留在 PEL 中的死 ID 列表（`deleted_ids`），調用者可據此直接執行 `XACK` 清除。

官方原文引用：
> "This command transfers ownership of pending stream entries that match the specified criteria. Conceptually, XAUTOCLAIM is equivalent to calling XPENDING and then XCLAIM, but provides a more efficient way to iterate the PEL using a cursor."
> "The command returns an array of elements: the next cursor to iterate over, the claimed messages, and a list of message IDs that were removed from the stream."

### 2.2 BullMQ Parent-Child Flow 規格：樹狀依賴與原子獎勵

#### 官方規格來源與文檔引用
- **BullMQ 官方架構文檔**：[https://docs.bullmq.io/guide/flows](https://docs.bullmq.io/guide/flows)

#### 架構與機制解析
BullMQ 是基於 Redis/Valkey 構建的高性能 Node.js/TypeScript 分布式工作流引擎，其核心特性之一是透過 `FlowProducer` 實現父子階層任務依賴（Parent-Child Dependencies）：
1. **`waiting-children` 狀態機**：父任務（Parent Job）在派生出子任務（Children Jobs）後，其狀態由 `active` 轉入 `waiting-children` 狀態，父任務不會佔用 Worker 執行緒。
2. **依賴計數與原子解鎖**：BullMQ 使用 Redis Hash 保存父任務的依賴樹（包含 `dependenciesCount` 與 `children` 映射）。
3. **子任務完成觸發（On-Complete Trigger）**：當子任務執行完畢時，透過 Lua Script 在 Redis 內部原子執行：
   - 記錄子任務產物至父任務的資料空間。
   - 將父任務的未完成子任務計數器減 1（`HINCRBY parentKey dependenciesCount -1`）。
   - 若計數器歸零，自動將父任務移回 `wait` / `prioritized` 佇列，等待 Worker 拾取繼續執行，並發放親代紅利/能量更新。
4. **冪等防護**：所有的依賴結算均封裝在單一 Lua 腳本內，確保即使子任務因網路異常發生重複重試，父任務計數器與紅利發放也具備嚴格的冪等性（Idempotency）。

## Section 3: 現況 vs 外部深度對照與差距分析 (Architecture Delta Matrix)

### 3.1 架構對照矩陣 (Delta Matrix)

| 維度 | Nova / QQS 現況 (`02_pull_worker.py`) | 外部成熟方案 (Valkey 7+ / BullMQ / Temporal) | 核心差距與痛點根因 | 建議改善路徑 |
| :--- | :--- | :--- | :--- | :--- |
| **孤兒任務收割 (Orphan Harvesting)** | 僅在 Worker 啟動時調用 `check_and_reclaim_orphans`，使用 `XPENDING` 查詢前 100 筆並用 `XCLAIM` 轉手。 | 獨立背景 Reaper 執行緒，週期性調用 `XAUTOCLAIM` 原語，配合游標循環遍歷整個 PEL。 | 現況在常駐運行期間無法回收孤兒；`XPENDING` 存在 N+1 查詢瓶頸與並發競爭。 | 在 Worker 內增加背景 Reaper 執行緒，以 `XAUTOCLAIM` 配合游標遍歷自動接管超過 `orphan_idle_s` 的孤兒。 |
| **進度租約與保真度 (Progress Lease)** | 僅有 Process 級心跳 (`worker:hb:{consumer}`)，每 15 秒更新；執行期間無任務級進度上報。 | 任務級動態租約 (Lease Renewal)；Worker 定期發送 `keep_alive` / `progress` 更新任務的最後活躍時間。 | 無法區分「長任務正常運算中」與「子行程卡死/死鎖」；PEL idle 時間無法被正在執行的 Worker 延長。 | 建立 Progress Lease 機制；任務執行中定時更新 Redis Key 或重置 PEL 租約，區分真死鎖與重運算。 |
| **毒丸防禦 (Poison-Pill Breaker)** | 依賴 Python 層捕獲異常並執行 `HINCRBY task:attempts`；滿 2 次進死信。 | 讀取 PEL 的 `delivery_count`（或 `XAUTOCLAIM` 遞增計數）；由伺服器端原生維護遞送次數。 | 若任務導致進程 Fatal Crash (SIGSEGV/OOM)，Python 無法寫入 `attempts`，引發重啟死迴圈。 | 領取任務時主動檢查 PEL 中該訊息的 `delivery_count`，若超過閾值（如 $\ge 3$）直接熔斷轉移至 `tasks:dead`。 |
| **親代工作流拓撲 (DAG Flow & Bounty)** | 依賴外部腳本與手動事件關聯；缺乏原生的依賴計數與原子狀態轉換。 | 基於 Redis Lua / Hash 的 Parent-Child 狀態機 (`waiting-children`)；原子計數遞減與冪等紅利解鎖。 | 親代紅利可能因重試導致重複結算；子任務併發完成時缺乏原子鎖，容易造成狀態不一致。 | 引入基於 `HSETNX` 與原子計數的 Parent Bounty 結算補丁，確保親代紅利發放嚴格冪等。 |

### 3.2 四大維度深度技術剖析

#### 1. 孤兒收割：`XPENDING + XCLAIM` vs `XAUTOCLAIM`
在舊架構中，檢測孤兒需要三步：
1. `XPENDING queue group - + 100` $\rightarrow$ 獲取 entry 陣列。
2. 針對每個 entry，調用 `XRANGE queue id id` 取得任務的 `timeout_s` 與 `orphan_idle_s`。
3. 調用 `XCLAIM queue group consumer 0 id` 接管。

這種做法的致命弱點在於：如果多個 Worker 同時啟動，它們會拿到相同的 `XPENDING` 列表，並發起 `XRANGE` 與 `XCLAIM` 競爭；且一旦常駐運行後，沒有任何機制再次觸發此流程。而 `XAUTOCLAIM` 將「掃描過期條目」與「轉移所有權」合併為單一命令，返回游標以利連續迭代，直接消除了客戶端複雜的競爭邏輯。

#### 2. 進度租約：Process Heartbeat vs In-flight Lease
當前 `worker:hb:{consumer}` 僅設置了 30 秒的過期時間（EX 30）。當 Agent 執行複雜研究任務（如長達 1800 秒的開源調研）時，一旦 Agent 內部的 HTTP 請求掛起，只要 Python 主迴圈中的心跳執行緒還在跑，外界就判定該 Worker 是活的。
引進 Progress Lease 機制後，Worker 在呼叫 `POST /control` 期間，由輔助監控執行緒或 Agent 主動上報心跳（例如每 30 秒向 `task:lease:{task_id}` 刷新 TTL 或更新 `last_progress_at`）。若超時未刷新，調度器即可判定為 Agent-level 假死。

#### 3. 毒丸防禦：Application-level Retry Counter vs Server-side Delivery Count
`task:attempts:{task_id}` 是由應用層維護的計數器。如果崩潰發生在應用層之外（例如 C-extension 崩潰、Linux OOM Killer 發送 `SIGKILL`），記憶體中的狀態和未發出的 Redis 指令都會灰飛煙滅。
Valkey Stream 在內部 PEL 中為每條訊息天然維護了 `delivery_count`。每次該訊息被 `XREADGROUP`（重讀）或 `XCLAIM` / `XAUTOCLAIM` 成功宣告時，伺服器核心自動將計數器加 1。因此，利用 `XPENDING queue group id id 1` 查出的 `delivery_count` 是不可篡改、進程崩潰無關的客觀事實。

#### 4. 親代拓撲：手動關聯 vs 原子 DAG 解鎖
在 Issue #197 所描述的情境中，親代任務生成多個子任務。傳統實作在子任務完成時直接執行紅利加分，若子任務因網路抖動觸發重跑，紅利將被計算多次。
成熟架構利用 Redis 的原子操作 `HSETNX parent:bounty:{parent_id} {child_id} {bounty_amount}`。若返回 1 代表首次領取成功，進而執行加分；若返回 0 代表該子任務紅利已被領取過，直接忽略，達到完美的冪等性保證。

### 4.1 測試套件架構與 4 大測試邏輯

```python
# test_stream_harness.py 測試邏輯概覽
```

1. **Test 1: XAUTOCLAIM 週期性孤兒收割游標遍歷 (Orphan Reaper Verification)**
   - **測試邏輯**：建立測試 Stream `test:tasks:orphan` 與 Group `test_group`。由 `worker_alpha` 透過 `XREADGROUP` 領取 3 筆任務後模擬進程突然中斷（不發送 `XACK`）。等待閒置時間超過 2000ms 後，由 `worker_beta` 發起 `XAUTOCLAIM test:tasks:orphan test_group worker_beta 2000 0-0 COUNT 2`。
   - **驗證指標**：
     - 首輪調用成功宣告前 2 筆任務，並返回非 `0-0` 的下一個游標 ID。
     - 次輪調用以新游標進入，成功宣告第 3 筆任務並返回游標 `0-0`。
     - PEL 內部訊息所有權完全轉移為 `worker_beta`，且 `idle` 計時器被重置為 0。
   - **執行結果**：`PASSED`（游標正確推進，無訊息遺漏）。

2. **Test 2: In-flight Progress Lease 租約動態延長與假死判定 (Progress Lease)**
   - **測試邏輯**：模擬一個工時設定為 10 秒的長任務。Worker 領取任務後在背景執行緒中每 2 秒向 Redis Hash `task:lease:{task_id}` 刷新 `last_heartbeat`。模擬兩種場景：
     - 場景 A（正常工作）：Worker 持續刷新租約，外部巡檢判定其仍處於健康執行狀態，未將其視為孤兒。
     - 場景 B（任務卡死）：強制停止租約刷新執行緒，經過 5 秒後，巡檢程序成功偵測到租約過期並發出警報。
   - **驗證指標**：租約能夠動態延長任務存活期，且能在進程存活但任務死鎖時準確判定假死。
   - **執行結果**：`PASSED`（租約刷新與超時判定精確無誤）。

3. **Test 3: PEL Delivery Count 毒丸熔斷隔離驗證 (Poison-Pill Quarantine)**
   - **測試邏輯**：在 Stream 中注入一則會引發死迴圈的毒丸任務。Worker 在處理前先透過 `XPENDING` 檢驗該訊息的 `delivery_count`。模擬兩次非正常崩潰（跳過應用層的 `task:attempts` 更新），在第三次拉取或 `XAUTOCLAIM` 時，檢測到 `delivery_count >= 3`，觸發熔斷邏輯：直接將其寫入 `tasks:dead`，執行 `XACK` 並發送 `queue_task_poison_quarantined` 事件。
   - **驗證指標**：即使應用層崩潰未記錄 attempts，系統仍依賴 PEL 內建計數器成功在第 3 次遞送時捕獲毒丸並安全隔離，防止 Worker 無限重啟。
   - **執行結果**：`PASSED`（毒丸成功被熔斷並隔離至死信隊列）。

4. **Test 4: DAG Parent-Child Flow 與 HSETNX 冪等紅利結算 (Parent Bounty Atomicity)**
   - **測試邏輯**：構建親代任務 `parent_001` 與兩個子任務 `child_001`, `child_002`。在 Redis 中維護父任務依賴計數器 `parent:pending:parent_001`（初始值為 2）。當子任務完成時，執行原子操作：
     ```redis
     HSETNX parent:bounties:parent_001 child_001 50
     DECR parent:pending:parent_001
     ```
     模擬 `child_001` 發生重試並再次執行結算。
   - **驗證指標**：
     - 首次結算時 `HSETNX` 返回 1，計數器成功減 1。
     - 重複結算時 `HSETNX` 返回 0，計數器未被重複扣減，紅利未被重複累加。
     - 兩個子任務均完成後，父任務依賴歸零並成功解鎖。
   - **執行結果**：`PASSED`（親代紅利防重刷與 DAG 解鎖完全冪等）。

本研究系統化梳理了 Nova 鎮內基於 Valkey Stream 構建 Agent 任務佇列的工程現狀，定位了孤兒滯留、工時黑箱、毒丸死迴圈及親代紅利競爭等深層缺陷。透過引入現代 Valkey 7+ 的 `XAUTOCLAIM` 原語、進度租約延長、原生 `delivery_count` 熔斷及 `HSETNX` 冪等保護，Nova 任務佇列將具備高可用、自癒合與高並發一致性的工業級特徵。

本報告產出之 3 張 Task Cards 已完全就緒，後續席位可直接引用本研究（Slug: `uo-stream-task-queue-patterns`）進行開單與工程落地上線。
